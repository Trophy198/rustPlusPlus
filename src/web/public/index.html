<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>rustplusplus · Live Map</title>
<style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
        margin: 0; background: #12100e; color: #e6e1d8;
        font: 14px/1.4 -apple-system, Segoe UI, Roboto, sans-serif;
        display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }
    header {
        display: flex; align-items: center; gap: 14px; padding: 8px 14px;
        background: #1b1815; border-bottom: 1px solid #2c2823; flex: 0 0 auto;
    }
    header b { color: #cd412b; }
    header .sep { color: #4a453d; }
    #status { margin-left: auto; font-size: 12px; color: #8a8377; }
    #status.live::before { content: "●"; color: #4caf50; margin-right: 5px; }
    #status.down::before { content: "●"; color: #cd412b; margin-right: 5px; }
    select { background: #26221d; color: #e6e1d8; border: 1px solid #3a352e; border-radius: 5px; padding: 4px 8px; }
    #wrap { flex: 1 1 auto; position: relative; overflow: hidden; }
    #map { position: absolute; inset: 0; margin: auto; display: block; }
    #legend {
        position: absolute; left: 12px; bottom: 12px; background: rgba(20,18,15,.85);
        border: 1px solid #2c2823; border-radius: 8px; padding: 10px 12px; font-size: 12px;
    }
    #legend .row { display: flex; align-items: center; gap: 7px; margin: 3px 0; }
    #legend .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
    #count { position: absolute; right: 12px; top: 12px; background: rgba(20,18,15,.85);
        border: 1px solid #2c2823; border-radius: 8px; padding: 8px 11px; font-size: 12px; }
    #campanel { position: absolute; right: 12px; bottom: 12px; width: 260px;
        background: rgba(20,18,15,.9); border: 1px solid #2c2823; border-radius: 8px; padding: 10px; }
    #campanel .camrow { display: flex; gap: 6px; }
    #campanel input { flex: 1; min-width: 0; background: #26221d; color: #e6e1d8;
        border: 1px solid #3a352e; border-radius: 5px; padding: 4px 7px; font-size: 12px; }
    #campanel button { background: #3a352e; color: #e6e1d8; border: 0; border-radius: 5px;
        padding: 4px 10px; font-size: 12px; cursor: pointer; }
    #campanel button:hover { background: #4a453d; }
    #camframe { width: 100%; margin-top: 8px; border-radius: 5px; display: none; background: #000; }
    #cammsg { font-size: 11px; color: #8a8377; margin-top: 5px; min-height: 14px; }
</style>
</head>
<body>
<header>
    <b>rustplusplus</b><span class="sep">·</span> Live Map
    <select id="guildSel" title="Server"></select>
    <span id="status" class="down">connecting…</span>
</header>
<div id="wrap">
    <canvas id="map"></canvas>
    <div id="legend">
        <div class="row"><span class="dot" style="background:#4caf50"></span> Teammate (online)</div>
        <div class="row"><span class="dot" style="background:#8a8377"></span> Teammate (offline)</div>
        <div class="row"><span class="dot" style="background:#e53935"></span> Dead</div>
        <div class="row"><span class="dot" style="background:#e6b800"></span> Cargo Ship</div>
        <div class="row"><span class="dot" style="background:#d84315"></span> Patrol Heli</div>
        <div class="row"><span class="dot" style="background:#7e57c2"></span> Chinook 47</div>
        <div class="row"><span class="dot" style="background:#26a69a"></span> Locked Crate</div>
        <div class="row"><span class="dot" style="background:#5c6bc0"></span> Vending / Vendor</div>
    </div>
    <div id="count"></div>
    <div id="campanel">
        <div class="camrow">
            <input id="camid" placeholder="CCTV identifier" />
            <button id="camwatch">Watch</button>
            <button id="camstop" style="display:none">Stop</button>
        </div>
        <img id="camframe" alt="camera" />
        <div id="cammsg"></div>
    </div>
</div>

<script>
const MARKER = {
    1: { label: 'Player',      color: '#4caf50', r: 5 },
    2: { label: 'Explosion',   color: '#ff7043', r: 6 },
    3: { label: 'Vending',     color: '#5c6bc0', r: 4 },
    4: { label: 'Chinook 47',  color: '#7e57c2', r: 7 },
    5: { label: 'Cargo Ship',  color: '#e6b800', r: 7 },
    6: { label: 'Crate',       color: '#26a69a', r: 6 },
    7: { label: 'Radius',      color: '#90a4ae', r: 5 },
    8: { label: 'Patrol Heli', color: '#d84315', r: 7 },
    9: { label: 'Vendor',      color: '#5c6bc0', r: 6 }
};

const img = new Image();
let meta = null, curGuild = null, imgLoaded = false;
let playerCount = 0, onlineCount = 0, markerCount = 0;

/* view = pan/zoom on top of the base (map-fit-to-canvas) transform */
const view = { scale: 1, x: 0, y: 0 };
let baseScale = 1; /* image px -> canvas px at zoom 1 */

/* interpolated entities: key -> { data, cx, cy (current world), tx, ty (target world) } */
const ents = new Map();
const EASE = 0.12; /* per-frame easing toward target (smooth glide between polls) */

const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const guildSel = document.getElementById('guildSel');
const countEl = document.getElementById('count');
const camid = document.getElementById('camid');
const camwatch = document.getElementById('camwatch');
const camstop = document.getElementById('camstop');
const camframe = document.getElementById('camframe');
const cammsg = document.getElementById('cammsg');
let wsRef = null;

camwatch.addEventListener('click', () => {
    const id = camid.value.trim();
    if (!id || !wsRef || wsRef.readyState !== 1 || !curGuild) return;
    wsRef.send(JSON.stringify({ type: 'camera:subscribe', guildId: curGuild, identifier: id }));
    cammsg.textContent = 'connecting…';
});
camstop.addEventListener('click', () => {
    if (wsRef && wsRef.readyState === 1) wsRef.send(JSON.stringify({ type: 'camera:unsubscribe' }));
    camframe.style.display = 'none'; camwatch.style.display = ''; camstop.style.display = 'none'; cammsg.textContent = '';
});

function worldToImg(x, y) {
    const px = x * ((meta.width - 2 * meta.oceanMargin) / meta.mapSize) + meta.oceanMargin;
    const py = meta.height - (y * ((meta.height - 2 * meta.oceanMargin) / meta.mapSize) + meta.oceanMargin);
    return [px, py];
}

/* world coords -> screen px (base fit + pan/zoom) */
function worldToScreen(x, y) {
    const [ix, iy] = worldToImg(x, y);
    return [ix * baseScale * view.scale + view.x, iy * baseScale * view.scale + view.y];
}

function fitCanvas() {
    if (!meta) return;
    const wrap = document.getElementById('wrap');
    const size = Math.min(wrap.clientWidth, wrap.clientHeight) - 8;
    canvas.width = size; canvas.height = size;
    canvas.style.width = size + 'px'; canvas.style.height = size + 'px';
    canvas.style.cursor = 'grab';
    baseScale = canvas.width / meta.width;
    clampView();
}

function draw() {
    if (!meta || !imgLoaded) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    /* map image with pan/zoom */
    ctx.drawImage(img, view.x, view.y, canvas.width * view.scale, canvas.height * view.scale);

    /* entities (markers first), constant screen size */
    for (const e of ents.values()) {
        const d = e.data;
        const [sx, sy] = worldToScreen(e.cx, e.cy);
        if (sx < -40 || sy < -40 || sx > canvas.width + 40 || sy > canvas.height + 40) continue;
        if (d.kind === 'marker') {
            const spec = MARKER[d.type] || { color: '#bbb', r: 5 };
            dot(sx, sy, spec.r, spec.color);
        }
        else {
            const color = !d.isAlive ? '#e53935' : (d.isOnline ? '#4caf50' : '#8a8377');
            dot(sx, sy, 5, color);
            ctx.font = '11px sans-serif';
            const w = ctx.measureText(d.name).width;
            ctx.fillStyle = 'rgba(0,0,0,.6)';
            ctx.fillRect(sx + 7, sy - 8, w + 6, 14);
            ctx.fillStyle = '#fff';
            ctx.fillText(d.name, sx + 10, sy + 2);
        }
    }

    countEl.textContent = `${onlineCount}/${playerCount} online · ${markerCount} markers`;
}

function dot(x, y, r, color) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.stroke();
}

/* continuous render loop: ease each entity toward its target -> smooth glide between polls */
function frame() {
    for (const e of ents.values()) {
        e.cx += (e.tx - e.cx) * EASE;
        e.cy += (e.ty - e.cy) * EASE;
    }
    draw();
    requestAnimationFrame(frame);
}

function resetView() { view.scale = 1; view.x = 0; view.y = 0; }

function clampView() {
    if (view.scale < 1) view.scale = 1;
    const mapSize = canvas.width * view.scale;
    view.x = Math.min(0, Math.max(canvas.width - mapSize, view.x));
    view.y = Math.min(0, Math.max(canvas.height - mapSize, view.y));
}

function loadGuild(guildId) {
    curGuild = guildId;
    imgLoaded = false;
    ents.clear();
    resetView();
    img.onload = () => { imgLoaded = true; fitCanvas(); };
    img.src = '/map/' + guildId + '?t=' + Date.now();
}

function upsert(key, data, tx, ty) {
    let e = ents.get(key);
    if (!e) { e = { cx: tx, cy: ty }; ents.set(key, e); } /* new entity starts at target */
    e.data = data; e.tx = tx; e.ty = ty; e.seen = true;
}

function applySnapshot(d) {
    if (!curGuild) { populateGuild(d.guildId, d.serverName); loadGuild(d.guildId); }
    if (d.guildId !== curGuild) return;
    meta = d.meta;
    if (canvas.width) baseScale = canvas.width / meta.width;

    for (const e of ents.values()) e.seen = false;

    const players = d.players || [], markers = d.markers || [];
    onlineCount = 0;
    for (const p of players) {
        if (p.isOnline) onlineCount++;
        if (!p.isOnline && !p.isAlive) continue;
        p.kind = 'player';
        upsert('p' + p.steamId, p, p.x, p.y);
    }
    let mc = 0;
    for (const m of markers) {
        if (m.type === 1) continue;
        m.kind = 'marker';
        upsert('m' + m.id, m, m.x, m.y); mc++;
    }
    playerCount = players.length; markerCount = mc;

    for (const [k, e] of ents) if (!e.seen) ents.delete(k);
}

function populateGuild(guildId, name) {
    if ([...guildSel.options].some(o => o.value === guildId)) return;
    const o = document.createElement('option');
    o.value = guildId; o.textContent = name || guildId;
    guildSel.appendChild(o); guildSel.value = guildId;
}

guildSel.addEventListener('change', () => loadGuild(guildSel.value));
window.addEventListener('resize', fitCanvas);

/* pan (drag) */
let dragging = false, lastX = 0, lastY = 0;
canvas.addEventListener('mousedown', (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; canvas.style.cursor = 'grabbing'; });
window.addEventListener('mouseup', () => { dragging = false; canvas.style.cursor = 'grab'; });
window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    view.x += e.clientX - lastX; view.y += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    clampView();
});

/* zoom (wheel toward cursor) */
canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const ns = Math.min(8, Math.max(1, view.scale * (e.deltaY < 0 ? 1.1 : 1 / 1.1)));
    const k = ns / view.scale;
    view.x = mx - (mx - view.x) * k;
    view.y = my - (my - view.y) * k;
    view.scale = ns;
    clampView();
}, { passive: false });

/* double-click resets the view */
canvas.addEventListener('dblclick', () => { resetView(); });

requestAnimationFrame(frame);

function connect() {
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
    wsRef = ws;
    ws.onopen = () => { statusEl.className = 'live'; statusEl.textContent = 'live'; };
    ws.onclose = () => { statusEl.className = 'down'; statusEl.textContent = 'reconnecting…'; setTimeout(connect, 2000); };
    ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === 'init') { (msg.guilds || []).forEach(g => { populateGuild(g.guildId, g.serverName); applySnapshot(g); }); }
        else if (msg.type === 'update') { populateGuild(msg.guildId, msg.serverName); applySnapshot(msg); }
        else if (msg.type === 'camera:frame') {
            camframe.src = 'data:image/png;base64,' + msg.data;
            camframe.style.display = 'block'; camwatch.style.display = 'none'; camstop.style.display = ''; cammsg.textContent = '';
        }
        else if (msg.type === 'camera:subscribed') { cammsg.textContent = 'subscribed: ' + msg.identifier; camwatch.style.display = 'none'; camstop.style.display = ''; }
        else if (msg.type === 'camera:error') { cammsg.textContent = 'error: ' + msg.error; camwatch.style.display = ''; camstop.style.display = 'none'; }
    };
}
connect();
</script>
</body>
</html>
